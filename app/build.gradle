plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.codeyumx.picofacetracking'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.codeyumx.picofacetracking'
        // The headset runs Android 10. Target SDK 29 keeps the app in the untrusted_app SELinux domain,
        // which PICO's policy allows to look up pxreyetrackingservice.
        minSdk 29
        targetSdk 29
        versionCode 11
        versionName '1.8.1'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    sourceSets {
        main {
            // The paid tracking adjustments, checked out from the private repository for release builds.
            // Without them this builds the free app (README, "Open core").
            def paid = rootProject.file('pro/src')
            if (paid.exists())
                java.srcDirs += paid
        }
    }

    signingConfigs {
        release {
            def keystore = System.getenv('SIGNING_KEYSTORE')
            if (keystore != null) {
                storeFile file(keystore)
                storeType 'pkcs12'
                storePassword System.getenv('SIGNING_PASSWORD')
                keyAlias 'picofacetracking'
                keyPassword System.getenv('SIGNING_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        // Target SDK 29 is deliberate, see defaultConfig.
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
