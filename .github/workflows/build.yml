name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Release tags only: add the paid tracking adjustments from the private repository (README, "Open core").
      # Other builds, and every build in a fork, make the free app.
      - name: Add paid features
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@v4
        with:
          repository: codeyumx/PicoFaceTracking-pro
          ssh-key: ${{ secrets.PRO_DEPLOY_KEY }}
          path: pro

      - name: Check the release has the paid features
        if: startsWith(github.ref, 'refs/tags/v')
        run: test -d pro/src || { echo "release build without the paid features"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build APK
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            export SIGNING_KEYSTORE="$RUNNER_TEMP/release.p12"
            gradle --no-daemon assembleRelease
            rm -f "$RUNNER_TEMP/release.p12"
            cp app/build/outputs/apk/release/app-release.apk PicoFaceTracking.apk
          else
            # Forks and pull requests have no signing key: debug-signed build.
            gradle --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk PicoFaceTracking.apk
          fi
          sha256sum PicoFaceTracking.apk | tee PicoFaceTracking.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: PicoFaceTracking
          path: |
            PicoFaceTracking.apk
            PicoFaceTracking.apk.sha256

  # The VRCFaceTracking module in module/ (a subtree of codeyumx/PicoFacialDataModule, see README "The PC module").
  module:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: module
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore PicoFacialDataModule.slnx

      - name: Build
        run: msbuild PicoFacialDataModule/PicoFacialDataModule.csproj /p:Configuration=Release /p:BuildProjectReferences=true

      - name: Tests
        run: dotnet test PicoFacialDataModule.Tests/PicoFacialDataModule.Tests.csproj -c Release

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path "PicoFacialDataModule/bin/Release/net10.0/PicoFacialDataModule.dll", "PicoFacialDataModule/bin/Release/net10.0/FaceBridge.Sdk.dll", "module.json" -DestinationPath Pico4FaceTracking-VRCFT.zip -Force
          (Get-FileHash Pico4FaceTracking-VRCFT.zip -Algorithm SHA256).Hash.ToLower() + "  Pico4FaceTracking-VRCFT.zip" | Out-File -Encoding ascii Pico4FaceTracking-VRCFT.zip.sha256
          Get-Content Pico4FaceTracking-VRCFT.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Pico4FaceTracking-VRCFT
          path: |
            module/Pico4FaceTracking-VRCFT.zip
            module/Pico4FaceTracking-VRCFT.zip.sha256

  # The native OSCFT for VRC module in native/ (Rust, no .NET), one binary per platform.
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Tests
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: |
            native/target/release/Pico4FaceTracking
            native/target/release/Pico4FaceTracking.exe
          if-no-files-found: error

  # One zip for both platforms: OSCFT starts Pico4FaceTracking.exe on Windows and Pico4FaceTracking on Linux.
  native-zip:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-bin
          merge-multiple: true

      - name: Zip
        run: |
          mkdir zip
          cp native-bin/Pico4FaceTracking native-bin/Pico4FaceTracking.exe zip/
          chmod +x zip/Pico4FaceTracking
          # Same version as the .NET module of this release.
          jq --arg v "$(jq -r .Version module/module.json)" '.Version = $v' native/module.json > zip/module.json
          (cd zip && zip -9 ../Pico4FaceTracking-OSCFT-native.zip Pico4FaceTracking Pico4FaceTracking.exe module.json)
          sha256sum Pico4FaceTracking-OSCFT-native.zip | tee Pico4FaceTracking-OSCFT-native.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Pico4FaceTracking-OSCFT-native
          path: |
            Pico4FaceTracking-OSCFT-native.zip
            Pico4FaceTracking-OSCFT-native.zip.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [app, module, native-zip]
    runs-on: ubuntu-latest
    steps:
      # For app/build.gradle and versions.json; before the download, which it would otherwise clean away.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Component versions
        id: versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # What each component ships with: the app's versionName and the Version in each module zip's module.json.
          APP=$(sed -n "s/^ *versionName *'\(.*\)'.*/\1/p" app/build.gradle)
          MODULE=$(unzip -p Pico4FaceTracking-VRCFT.zip module.json | jq -r '.Version // empty')
          NATIVE=$(unzip -p Pico4FaceTracking-OSCFT-native.zip module.json | jq -r '.Version // empty')
          for pair in "app=$APP" "module=$MODULE" "native=$NATIVE"; do
            [[ -n "${pair#*=}" ]] || { echo "::error::no ${pair%%=*} version found"; exit 1; }
            echo "$pair" >> "$GITHUB_OUTPUT"
          done
          # versions.json is where OSCFT users' update notices come from (build-releases.md). Pre-releases leave it at
          # the last full release; a full release must list exactly what it ships.
          [[ "$TAG" == *-* ]] && exit 0
          failed=0
          for pair in "appVersion=$APP" "moduleVersion=$MODULE" "nativeModuleVersion=$NATIVE"; do
            key=${pair%%=*} shipped=${pair#*=}
            listed=$(jq -r --arg k "$key" '.[$k] // empty' versions.json)
            if [[ "$listed" != "$shipped" ]]; then
              echo "::error file=versions.json::$key is '$listed' but the release ships $shipped"
              failed=1
            fi
          done
          exit $failed

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          APP_VERSION: ${{ steps.versions.outputs.app }}
          MODULE_VERSION: ${{ steps.versions.outputs.module }}
          NATIVE_VERSION: ${{ steps.versions.outputs.native }}
        run: |
          # Short notes; the full instructions are in the README. Checksums are the .sha256 files attached to the release.
          NOTES="Install \`PicoFaceTracking.apk\` on your headset, then install the tracking module in OSCFT."
          NOTES="$NOTES"$'\n\n'"**Versions**"
          NOTES="$NOTES"$'\n'"- App: $APP_VERSION"
          NOTES="$NOTES"$'\n'"- OSCFT native module: $NATIVE_VERSION"
          NOTES="$NOTES"$'\n'"- VRCFaceTracking module: $MODULE_VERSION"
          NOTES="$NOTES"$'\n\n'"**Which module (${TAG#v})**"
          NOTES="$NOTES"$'\n'"- [OSCFT for VRC](https://github.com/codeyumx/oscft_for_vrc) 0.2.0 or later: \`Pico4FaceTracking-OSCFT-native.zip\` (native, Windows and Linux, no .NET). Install it on the Modules page."
          NOTES="$NOTES"$'\n'"- [VRCFaceTracking](https://github.com/benaclejames/VRCFaceTracking): \`Pico4FaceTracking-VRCFT.zip\`. Module Registry, +, pick the zip."
          # A tag with a suffix (v1.9.3-rc1) is a pre-release and does not become the latest release.
          PRERELEASE=()
          [[ "$TAG" == *-* ]] && PRERELEASE=(--prerelease)
          gh release create "$TAG" PicoFaceTracking.apk PicoFaceTracking.apk.sha256 \
            Pico4FaceTracking-VRCFT.zip Pico4FaceTracking-VRCFT.zip.sha256 \
            Pico4FaceTracking-OSCFT-native.zip Pico4FaceTracking-OSCFT-native.zip.sha256 \
            "${PRERELEASE[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Pico Face Tracking ${TAG#v}" \
            --notes "$NOTES"
